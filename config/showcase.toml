[[projects]]
slug = "daily"
name = "Daily"
category = "Obsidian Plugin"
summary = "Daily workflow plugin for tasks, projects, quick notes, and progress review inside Obsidian."
long_description = "Daily connects daily tasks, project planning, quick capture, and review dashboards inside Obsidian. It supports table, kanban, gantt, and mind map project views, with heatmaps and trend charts for tracking progress over time."
status = "active"
year = "2026"
role = "Full-stack / Plugin Developer"
platform = "Obsidian"
project_type = "Plugin"
featured = true
visibility = "public"
sort_order = 10
cover_asset_key = "projects/daily/releases/v1.0.0/html/总览.png"
hero_asset_key = "projects/daily/releases/v1.0.0/html/总览.png"
tech_stack = ["TypeScript", "Obsidian", "CSS", "Local-first", "Project Management"]
features = [
  "Task overview with today view, timeline, trend charts, weekly charts, and yearly heatmap",
  "Project management with import/export and multiple project views",
  "Four project views: table, kanban, gantt, and mind map",
  "Quick capture for diary entries, appended notes, tasks, and mind map nodes",
  "Progress review with heatmaps and completion trends"
]
architecture = [
  "Obsidian plugin runtime",
  "Local vault data files",
  "Task and project models",
  "Multiple visual project views",
  "Review dashboards and charts"
]
challenge = "Daily work often scatters across notes, task lists, project plans, and review pages, which makes it hard to keep a clear workflow inside Obsidian."
solution = "Daily unifies tasks, projects, quick capture, and review views into one Obsidian plugin, keeping data local and giving the same project multiple visual perspectives."
result = "The v1.0.0 release provides a usable Obsidian workflow for daily task tracking, project planning, and progress review."

