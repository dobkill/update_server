[[recommendation]]
product_code = "Daily"
sort_order = 10
status = "active"

[[release]]
product_code = "Daily"
version = "v1.0.0"
release_note = "Daily v1.0.0 首个可用版本。"
data_schema_version = "v1.0.0"
status = "active"
vue_path = "/data/releases/Daily/v1.0.0/vue/DailyReleasePage.vue"

[[release.asset]]
platform = "obsidian"
arch = "any"
package_type = "plugin"
file_path = "./data/packages/Daily/v1.0.0/Daily-v1.0.0.zip"
auto_hash = true
auto_size = true

[[release.channel]]
channel = "stable"
is_latest = true

[[convert_rule]]
product_code = "Daily"
source_schema = "v0.9.0"
target_schema = "v1.0.0"
script_path = "python/convert/convert_data.py"
cost_time = 5
auto_hash = false

[cleanup]
directory = "./data/temp"
older_than_hours = 24
